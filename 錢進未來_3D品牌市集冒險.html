<script type="module">
import * as THREE from 'three';
const root=document.getElementById('scene'),loading=document.getElementById('loading');let scene,camera,renderer,clock,player,vehicle,vehicleSpeed=0,driving=false,nearVehicle=false,avatarParts=[],stations=[],coins=[],keys={},score=0,tokens=0,nearStation=null,modalOpen=true,marketRound=0,marketProfit=0,logoIcon='🌱',logoColor='#ffeab0',logoName='小樹好食光';const completed={finance:false,logo:false,market:false};
function makeMat(color,roughness=.82){return new THREE.MeshStandardMaterial({color,roughness})}
function box(w,h,d,color,x,y,z,material){let m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material||makeMat(color));m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m}
function makeLabel(text,color){let c=document.createElement('canvas');c.width=512;c.height=128;let g=c.getContext('2d');g.fillStyle='rgba(255,251,237,.96)';g.roundRect(8,8,496,112,28);g.fill();g.strokeStyle=color;g.lineWidth=8;g.roundRect(8,8,496,112,28);g.stroke();g.fillStyle='#263451';g.font='bold 38px "Noto Sans TC", sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,256,65);let tex=new THREE.CanvasTexture(c);tex.colorSpace=THREE.SRGBColorSpace;let s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));s.scale.set(4.4,1.1,1);return s}
function addTree(x,z,size=1){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.16*size,.24*size,1.25*size,8),makeMat('#94684c'));trunk.position.set(x,.62*size,z);trunk.castShadow=true;scene.add(trunk);for(let j=0;j<3;j++){let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(.65*size,1),makeMat(['#68bc8c','#79c995','#55aa7d'][j]));crown.position.set(x+(j-1)*.35*size,1.35*size+j%2*.22*size,z);crown.castShadow=true;scene.add(crown)}}
function addStation(id,title,x,z,color,icon){let group=new THREE.Group();group.position.set(x,0,z);scene.add(group);let base=new THREE.Mesh(new THREE.BoxGeometry(4.7,2.1,3.1),makeMat('#fff5dd'));base.position.y=1.05;base.castShadow=true;base.receiveShadow=true;group.add(base);let counter=new THREE.Mesh(new THREE.BoxGeometry(4.82,.2,3.2),makeMat(color));counter.position.y=2.16;counter.castShadow=true;group.add(counter);let roof=new THREE.Mesh(new THREE.ConeGeometry(3.15,1.3,4),makeMat(color));roof.position.y=3.05;roof.rotation.y=Math.PI/4;roof.castShadow=true;group.add(roof);let awning=new THREE.Mesh(new THREE.BoxGeometry(4.3,.23,.58),makeMat('#fffdf4'));awning.position.set(0,2.62,1.7);group.add(awning);let iconMesh=new THREE.Mesh(new THREE.SphereGeometry(.45,20,16),makeMat('#fff1bb'));iconMesh.position.set(-1.35,1.68,1.65);group.add(iconMesh);let label=makeLabel(title,color);label.position.set(0,4.45,0);group.add(label);let ring=new THREE.Mesh(new THREE.TorusGeometry(3.1,.075,8,48),new THREE.MeshBasicMaterial({color,transparent:true,opacity:.65}));ring.rotation.x=-Math.PI/2;ring.position.y=.045;group.add(ring);let marker=new THREE.Mesh(new THREE.OctahedronGeometry(.42),new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:.25}));marker.position.set(0,5.45,0);group.add(marker);stations.push({id,title,x,z,color,group,marker,ring,icon})}
function addCoin(x,z,i){let g=new THREE.Group();g.position.set(x,.65,z);scene.add(g);let mesh=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.12,32),new THREE.MeshStandardMaterial({color:'#ffd45d',metalness:.55,roughness:.3,emissive:'#a76616',emissiveIntensity:.13}));mesh.rotation.x=Math.PI/2;mesh.castShadow=true;g.add(mesh);let t=new THREE.Mesh(new THREE.TorusGeometry(.22,.035,8,24),makeMat('#fff0a3'));t.position.z=.07;g.add(t);coins.push({group:g,mesh,baseY:.65,collected:false,phase:i*.8})}
function buildDeliveryCar(){vehicle=new THREE.Group();scene.add(vehicle);vehicle.position.set(2.2,0,9.1);let body=new THREE.Mesh(new THREE.BoxGeometry(2.35,.72,3.55),makeMat('#fff3d8'));body.position.y=.78;body.castShadow=true;body.receiveShadow=true;vehicle.add(body);let cabin=new THREE.Mesh(new THREE.BoxGeometry(2.12,.98,1.85),makeMat('#ff8a75'));cabin.position.set(0,1.55,.38);cabin.castShadow=true;vehicle.add(cabin);let windshield=new THREE.Mesh(new THREE.BoxGeometry(1.72,.52,.07),new THREE.MeshStandardMaterial({color:'#a8dce5',roughness:.22,metalness:.1}));windshield.position.set(0,1.63,-.57);vehicle.add(windshield);for(let side of [-1,1]){let win=new THREE.Mesh(new THREE.BoxGeometry(.07,.48,.88),new THREE.MeshStandardMaterial({color:'#a8dce5',roughness:.22,metalness:.1}));win.position.set(side*1.08,1.64,.45);vehicle.add(win);let wheel=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.28,18),makeMat('#30354a'));wheel.rotation.z=Math.PI/2;wheel.position.set(side*1.13,.48,-1.05);wheel.castShadow=true;vehicle.add(wheel);let rearWheel=new THREE.Mesh(new THREE.CylinderGeometry(.39,.39,.28,18),makeMat('#30354a'));rearWheel.rotation.z=Math.PI/2;rearWheel.position.set(side*1.13,.48,1.08);rearWheel.castShadow=true;vehicle.add(rearWheel)}let bumper=new THREE.Mesh(new THREE.BoxGeometry(2.42,.18,.16),makeMat('#52617d'));bumper.position.set(0,.49,-1.82);vehicle.add(bumper);for(let side of [-1,1]){let lamp=new THREE.Mesh(new THREE.BoxGeometry(.38,.22,.08),makeMat('#ffe88c'));lamp.position.set(side*.78,.88,-1.8);vehicle.add(lamp)}let logo=new THREE.Mesh(new THREE.BoxGeometry(.06,.42,.95),makeMat('#66c69f'));logo.position.set(1.19,1.2,.75);vehicle.add(logo);let label=makeLabel('品牌配送車','#ff8a75');label.scale.set(2.5,.64,1);label.position.set(0,2.25,.28);vehicle.add(label);let roofline=new THREE.Mesh(new THREE.BoxGeometry(1.9,.12,1.52),makeMat('#ffd66b'));roofline.position.set(0,2.07,.38);vehicle.add(roofline);}
function buildWorld(){scene=new THREE.Scene();scene.background=new THREE.Color('#b7e3ed');scene.fog=new THREE.Fog('#b7e3ed',28,55);camera=new THREE.PerspectiveCamera(44,innerWidth/innerHeight,.1,100);renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;root.appendChild(renderer.domElement);clock=new THREE.Clock();scene.add(new THREE.HemisphereLight('#fff8df','#748c87',2.1));let sun=new THREE.DirectionalLight('#fff1ca',3.0);sun.position.set(-9,18,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-24;scene.add(sun);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(42,42),makeMat('#91cc9f'));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// paths and plaza
let pathmat=makeMat('#e8d6a5');let mainpath=new THREE.Mesh(new THREE.PlaneGeometry(5,31),pathmat);mainpath.rotation.x=-Math.PI/2;mainpath.position.set(0,.012,0);mainpath.receiveShadow=true;scene.add(mainpath);let cross=new THREE.Mesh(new THREE.PlaneGeometry(26,4),makeMat('#eddcae'));cross.rotation.x=-Math.PI/2;cross.position.set(0,.02,-4.5);cross.receiveShadow=true;scene.add(cross);let plaza=new THREE.Mesh(new THREE.CircleGeometry(5.4,48),makeMat('#f2dfa9'));plaza.rotation.x=-Math.PI/2;plaza.position.set(0,.03,1.5);scene.add(plaza);let inner=new THREE.Mesh(new THREE.CircleGeometry(3.8,48),makeMat('#f8eac1'));inner.rotation.x=-Math.PI/2;inner.position.set(0,.04,1.5);scene.add(inner);
// little market square
addStation('finance','理財補給站',-8,-7,'#66c69f','🪙');addStation('logo','品牌設計工坊',0,-11,'#9689ed','🎨');addStation('market','小小品牌市集',8,-7,'#ff8a75','🏪');
// trees, shrubs and flags
[[-14,-13],[-13,-1],[-14,9],[-10,13],[14,-13],[14,1],[14,11],[10,14],[-3,-16],[4,-16]].forEach((p,i)=>addTree(p[0],p[1],.8+(i%3)*.15));
// benches around plaza
for(let a=0;a<4;a++){let angle=a*Math.PI/2+.4,x=Math.cos(angle)*6.7,z=1.5+Math.sin(angle)*6.7;let seat=box(2.1,.24,.55,'#ba8055',x,.42,z);box(2.1,.2,.2,'#855b46',x,.76,z-.15);box(.18,.6,.18,'#79553e',x-.8,.15,z);box(.18,.6,.18,'#79553e',x+.8,.15,z)}
// decorative flag poles
for(let i=0;i<5;i++){let x=-12+i*6,z=2+(i%2?4:-3);box(.08,3,.08,'#f6f0db',x,1.5,z);let flag=new THREE.Mesh(new THREE.PlaneGeometry(.9,.55),makeMat(['#ff8971','#ffd568','#8c83e2','#5cb99b','#f29a58'][i]));flag.position.set(x+.43,2.55,z);scene.add(flag)}
// collectibles along pathways
[[-4,-8],[-2,-5],[3,-6],[5,-2],[-4,1],[-2,6],[3,8],[10,-1],[-10,-2],[9,4],[0,-3]].forEach((p,i)=>addCoin(p[0],p[1],i));
// player character
player=new THREE.Group();scene.add(player);let shirt=new THREE.Mesh(new THREE.CapsuleGeometry(.48,.8,4,9),makeMat('#5267c9'));shirt.position.y=1.15;shirt.castShadow=true;player.add(shirt);let face=new THREE.Mesh(new THREE.SphereGeometry(.36,24,20),makeMat('#f4bd8d'));face.position.y=2.05;face.castShadow=true;player.add(face);let hair=new THREE.Mesh(new THREE.SphereGeometry(.38,20,16,0,Math.PI*2,0,Math.PI*.55),makeMat('#573d35'));hair.position.set(0,2.18,0);player.add(hair);let cap=new THREE.Mesh(new THREE.SphereGeometry(.39,20,12,0,Math.PI*2,0,Math.PI*.5),makeMat('#ffce53'));cap.position.set(0,2.37,0);player.add(cap);let eyesMat=makeMat('#263451');for(let x of [-.13,.13]){let eye=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),eyesMat);eye.position.set(x,2.08,.32);player.add(eye)}let bag=new THREE.Mesh(new THREE.BoxGeometry(.58,.58,.25),makeMat('#ff8a75'));bag.position.set(0,1.24,-.46);bag.castShadow=true;player.add(bag);player.position.set(0,0,10);buildDeliveryCar();
}
function updateHud(){document.getElementById('score').textContent=score;document.getElementById('tokens').textContent=tokens;for(let k of ['finance','logo','market']){let el=document.getElementById('q'+k[0].toUpperCase()+k.slice(1));el.classList.toggle('done',completed[k]);el.querySelector('.qdot').textContent=completed[k]?'✓':({finance:1,logo:2,market:3}[k])}if(completed.finance&&completed.logo&&completed.market){setTimeout(showFinish,350)}}
function showToast(text){let el=document.getElementById('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1900)}
function addScore(n){score+=n;updateHud()}
function openModal(html,wide=false){modalOpen=true;let box=document.getElementById('modal');box.className='modal'+(wide?' wide':'');box.innerHTML=html;document.getElementById('modalOverlay').classList.remove('hidden')}

function financeTask(){if(completed.finance){showToast('理財任務已完成，做得好！');return}openModal(`<button class="close" data-close>×</button><div class="modal-tag">MISSION 01 · MONEY SMART</div><h1>理財補給站</h1><p>你有 100 枚代幣，請安排日常支出、儲蓄和夢想基金。分配預算也是一種選擇練習。</p><div class="budget-summary"><span>已分配</span><b id="sumBudget">100 / 100 枚</b><span id="dreamShow">夢想 20</span></div><div class="budget-line"><span>🧺 日常所需</span><input id="needRange" type="range" min="0" max="100" value="50"><span class="value" id="needValue">50</span></div><div class="budget-line"><span>🏦 儲蓄基金</span><input id="saveRange" type="range" min="0" max="100" value="30"><span class="value" id="saveValue">30</span></div><div class="hint">挑戰條件：日常至少 40 枚、儲蓄至少 20 枚。剩下的就是夢想基金。</div><div class="feedback" id="fb"></div><div class="row" style="margin-top:14px"><span></span><button class="primary" id="submitBudget">確認我的預算　→</button></div>`);document.querySelector('[data-close]').onclick=closeModal;let nr=document.getElementById('needRange'),sr=document.getElementById('saveRange');function calc(which){let n=+nr.value,s=+sr.value;if(n+s>100){if(which==='n')sr.value=100-n;else nr.value=100-s;n=+nr.value;s=+sr.value}let d=100-n-s;document.getElementById('needValue').textContent=n;document.getElementById('saveValue').textContent=s;document.getElementById('sumBudget').textContent=`${n+s+d} / 100 枚`;document.getElementById('dreamShow').textContent=`夢想 ${d}`}nr.oninput=()=>calc('n');sr.oninput=()=>calc('s');document.getElementById('submitBudget').onclick=()=>{let n=+nr.value,s=+sr.value,fb=document.getElementById('fb');if(n<40||s<20){fb.style.color='#c86555';fb.textContent=n<40?'日常支出再多留一點，照顧生活基本需要喔。':'幫未來的自己多存一些，至少安排 20 枚儲蓄。';return}completed.finance=true;tokens+=20;addScore(100);fb.textContent='太棒了！你同時照顧現在的需要，也替未來存下資源。+20 代幣';updateHud();document.getElementById('submitBudget').textContent='任務完成　✓';document.getElementById('submitBudget').onclick=closeModal}}
function logoTask(){if(completed.logo){showToast('品牌設計任務已完成！');return}logoName='小樹好食光';logoIcon='🌱';logoColor='#ffeab0';openModal(`<button class="close" data-close>×</button><div class="modal-tag">MISSION 02 · BRAND STUDIO</div><h1>品牌設計工坊</h1><p>設計一個能表現品牌理念的標誌。想想圖案、色彩與店名，怎麼讓顧客一眼記住你？</p><label class="field-label" style="display:block">品牌名稱</label><input class="logo-input" id="brandInput" maxlength="16" value="小樹好食光"><div class="field-label" style="display:block;margin-top:14px">選一個品牌圖案</div><div class="choices icons">${['🌱','🍵','🍪','☀️','🐟'].map((a,i)=>`<button class="pick ${i===0?'active':''}" data-icon="${a}">${a}</button>`).join('')}</div><div class="field-label" style="display:block">品牌色彩</div><div class="choices">${['#ffeab0','#dbf0dc','#ffe0d9','#e4e0ff','#d9eef3'].map((c,i)=>`<button class="pick palette ${i===0?'active':''}" data-color="${c}" style="background:${c}"></button>`).join('')}</div><div class="preview" id="logoPreview" style="background:${logoColor}"><span class="preview-icon" id="logoIcon">${logoIcon}</span><span class="preview-name" id="logoName">${logoName}</span></div><div class="feedback" id="fb"></div><div class="row"><span></span><button class="primary" id="saveLogo">完成品牌設計　→</button></div>`);document.querySelector('[data-close]').onclick=closeModal;let input=document.getElementById('brandInput');input.oninput=()=>{logoName=input.value||'你的品牌';document.getElementById('logoName').textContent=logoName};document.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-icon]').forEach(x=>x.classList.remove('active'));b.classList.add('active');logoIcon=b.dataset.icon;document.getElementById('logoIcon').textContent=logoIcon});document.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-color]').forEach(x=>x.classList.remove('active'));b.classList.add('active');logoColor=b.dataset.color;document.getElementById('logoPreview').style.background=logoColor});document.getElementById('saveLogo').onclick=()=>{if(!input.value.trim()){document.getElementById('fb').textContent='先替品牌取個名字吧。';return}completed.logo=true;tokens+=20;addScore(100);document.getElementById('fb').textContent='標誌設計完成！你把品牌想法變成了看得見的圖像。+20 代幣';updateHud();document.getElementById('saveLogo').textContent='任務完成　✓';document.getElementById('saveLogo').onclick=closeModal}}

function showBuyer(){if(marketRound>=buyers.length){completed.market=true;tokens+=marketProfit;addScore(100);updateHud();openModal(`<div class="finish"><div class="finish-emoji">🏪✨</div><div class="modal-tag">MARKET DAY COMPLETE</div><h1>市集開張成功！</h1><p>你依照顧客的背景調整品牌介紹與價格，也體驗了成本和交易。每個市場都不同，懂得觀察顧客，就能做出更好的選擇。</p><div class="budget-summary"><span>本次市集盈餘</span><b>🪙 ${marketProfit} 枚代幣</b></div><button class="primary" id="closeMarket">完成任務 ✓</button></div>`);document.getElementById('closeMarket').onclick=closeModal;return}let b=buyers[marketRound],ad='';let price=20;openModal(`<button class="close" data-close>×</button><div class="modal-tag">MISSION 03 · MARKET DAY</div><h1>小小品牌市集</h1><p>商品成本 12 枚代幣。了解顧客後，選擇適合的介紹方式和售價，完成交易。</p><div class="market-customer"><div class="face">${b.emoji}</div><div class="face-copy"><b>${b.name}</b><span>${b.desc}</span></div></div><div class="field-label" style="display:block">你會怎麼介紹品牌？</div><div class="options-grid">${['在地故事','圖像＋簡易英文','可愛插圖＋學生優惠','大聲喊口號'].map(a=>`<button class="pick" data-ad="${a}">${a}</button>`).join('')}</div><div class="field-label" style="display:block;margin-top:14px">選擇售價（成本 12 枚）</div><div class="choices">${[15,20,30].map((p,i)=>`<button class="pick ${p===20?'active':''}" data-price="${p}">${p} 枚</button>`).join('')}</div><div class="feedback" id="fb"></div><div class="row"><span class="progress-mini">顧客 ${marketRound+1} / ${buyers.length}</span><button class="primary" id="serve">招呼顧客　→</button></div>`);document.querySelector('[data-close]').onclick=closeModal;document.querySelectorAll('[data-ad]').forEach(but=>but.onclick=()=>{document.querySelectorAll('[data-ad]').forEach(x=>x.classList.remove('active'));but.classList.add('active');ad=but.dataset.ad});document.querySelectorAll('[data-price]').forEach(but=>but.onclick=()=>{document.querySelectorAll('[data-price]').forEach(x=>x.classList.remove('active'));but.classList.add('active');price=+but.dataset.price});document.getElementById('serve').onclick=()=>{let fb=document.getElementById('fb');if(!ad){fb.style.color='#c86555';fb.textContent='先選一種品牌介紹方式。';return}let goodAd=ad===b.good,fair=price<=b.max;if(goodAd&&fair){let gain=price-12;marketProfit+=gain;tokens+=gain;addScore(40);fb.style.color='#43866e';fb.textContent=`成交！${b.tip} 售價 ${price} − 成本 12 = 盈餘 ${gain} 枚。`;updateHud()}else{fb.style.color='#b56252';fb.textContent=!goodAd?'介紹方式和顧客需求不太相符，試著因應客群調整行銷。':'售價超出顧客預算，定價也要考慮目標客群。'}let btn=document.getElementById('serve');btn.textContent=marketRound===buyers.length-1?'查看市集成果　→':'下一位顧客　→';btn.onclick=()=>{marketRound++;showBuyer()}}}
function showFinish(){if(document.getElementById('modalOverlay').classList.contains('hidden')){openModal(`<div class="finish"><div class="finish-emoji">🎉</div><div class="modal-tag">ALL QUESTS COMPLETE</div><h1>品牌市集冒險完成！</h1><p>你學會安排預算、設計品牌，也在市集裡練習理解顧客與公平定價。把這些想法帶回生活，做一位更有智慧的小小企業家！</p><div class="budget-summary"><span>任務點數</span><b>⭐ ${score} 點　·　🪙 ${tokens} 枚</b></div><button class="primary" id="replay">再玩一次</button></div>`);document.getElementById('replay').onclick=()=>location.reload()}}
function toggleDrive(){if(modalOpen)return;if(driving){driving=false;vehicleSpeed=0;player.position.set(THREE.MathUtils.clamp(vehicle.position.x+1.9,-17,17),0,vehicle.position.z);player.visible=true;showToast('\u5df2\u4e0b\u8eca\uff0c\u9760\u8fd1\u6524\u4f4d\u6309 E \u4e92\u52d5');return}let d=Math.hypot(player.position.x-vehicle.position.x,player.position.z-vehicle.position.z);if(d>3.8){showToast('\u5148\u8d70\u5230\u54c1\u724c\u914d\u9001\u8eca\u65c1\u908a');return}driving=true;player.visible=false;showToast('\u4e0a\u8eca\u6210\u529f\uff01W \u524d\u9032\u3001S \u5012\u8eca\u3001A\uff0fD \u8f49\u5411')}

function update(delta){let forward=keys['w']||keys['arrowup'],back=keys['s']||keys['arrowdown'],left=keys['a']||keys['arrowleft'],right=keys['d']||keys['arrowright'];if(!modalOpen&&driving){let throttle=(forward?1:0)-(back?1:0),steer=(right?1:0)-(left?1:0);vehicleSpeed=THREE.MathUtils.clamp(vehicleSpeed+throttle*9*delta,-4.2,9);vehicleSpeed*=Math.pow(.985,delta*60);if(Math.abs(vehicleSpeed)>.15)vehicle.rotation.y-=steer*delta*1.7*Math.sign(vehicleSpeed);vehicle.position.x=THREE.MathUtils.clamp(vehicle.position.x-Math.sin(vehicle.rotation.y)*vehicleSpeed*delta,-17,17);vehicle.position.z=THREE.MathUtils.clamp(vehicle.position.z-Math.cos(vehicle.rotation.y)*vehicleSpeed*delta,-17,17);player.position.set(vehicle.position.x,0,vehicle.position.z)}else if(!modalOpen&&(forward||back||left||right)){let x=(right?1:0)-(left?1:0),z=(back?1:0)-(forward?1:0),len=Math.hypot(x,z)||1;x/=len;z/=len;let speed=5.2;player.position.x=THREE.MathUtils.clamp(player.position.x+x*speed*delta,-17,17);player.position.z=THREE.MathUtils.clamp(player.position.z+z*speed*delta,-17,17);player.rotation.y=Math.atan2(x,z)}if(!driving)player.position.y=Math.sin(performance.now()*.007)*.035;
let actor=driving?vehicle:player;let closest=null,dist=999;for(let s of stations){let d=Math.hypot(actor.position.x-s.x,actor.position.z-s.z);if(d<dist){closest=s;dist=d}let pulse=1+Math.sin(performance.now()*.003+s.x)*.09;s.marker.position.y=5.45*pulse;s.ring.material.opacity=.48+Math.sin(performance.now()*.002)*.16}nearStation=dist<5?closest:null;let carDist=Math.hypot(player.position.x-vehicle.position.x,player.position.z-vehicle.position.z);nearVehicle=carDist<3.8&&!driving;let hint=document.getElementById('interact'),driveBtn=document.getElementById('touchDrive');if(driving){hint.classList.add('show');hint.querySelector('.keycap').textContent='F';document.getElementById('interactText').textContent='\u96e2\u958b\u54c1\u724c\u914d\u9001\u8eca';driveBtn.classList.add('show');driveBtn.textContent='\u4e0b\u8eca'}else if(nearVehicle){hint.classList.add('show');hint.querySelector('.keycap').textContent='F';document.getElementById('interactText').textContent='\u99d5\u99db\u54c1\u724c\u914d\u9001\u8eca';driveBtn.classList.add('show');driveBtn.textContent='\ud83d\ude90 \u4e0a\u8eca'}else if(nearStation&&!modalOpen){hint.classList.add('show');hint.querySelector('.keycap').textContent='E';document.getElementById('interactText').textContent=(completed[nearStation.id]?'\u518d\u6b21\u67e5\u770b\uff1a':'\u958b\u59cb\u4efb\u52d9\uff1a')+nearStation.title;driveBtn.classList.remove('show')}else{hint.classList.remove('show');driveBtn.classList.remove('show')}
for(let c of coins){if(c.collected)continue;c.group.rotation.y+=delta*1.4;c.group.position.y=c.baseY+Math.sin(performance.now()*.003+c.phase)*.18;let d=Math.hypot(actor.position.x-c.group.position.x,actor.position.z-c.group.position.z);if(d<(driving?1.8:1.1)){c.collected=true;scene.remove(c.group);tokens+=5;addScore(10);showToast('+5 ??????????');}}
